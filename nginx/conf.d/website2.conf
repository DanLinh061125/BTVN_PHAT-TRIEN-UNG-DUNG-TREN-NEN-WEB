# ==============================================================================
# VIRTUAL HOST 2: WEBSITE 2 (CÔNG NGHỆ & GIỚI THIỆU DỰ ÁN)
# Tên miền: website2.danlinhsiucutie.id.vn
# Thư mục gốc: /usr/share/nginx/html/website2
# ==============================================================================

server {
    listen 80;
    server_name website2.danlinhsiucutie.id.vn;

    root /usr/share/nginx/html/website2;
    index index.html index.htm;

    # Phục vụ file tĩnh website 2
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy cho API Node-RED nếu website 2 cũng cần gọi API
    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
