# ==============================================================================
# VIRTUAL HOST 1: WEBSITE BÁN HÀNG
# Tên miền: banhang.danlinhsiucutie.id.vn
# Thư mục gốc: /usr/share/nginx/html/banhang
# ==============================================================================

server {
    listen 80;
    server_name banhang.danlinhsiucutie.id.vn localhost 127.0.0.1;

    root /usr/share/nginx/html/banhang;
    index index.html index.htm;

    # Phục vụ file tĩnh website bán hàng
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy cho API Node-RED
    # Cho phép JavaScript fetch('/api/tacke') cùng origin, tránh lỗi CORS
    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tùy biến trang lỗi
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
